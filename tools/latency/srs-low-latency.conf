# SRS 低延迟配置：在 conf/http.flv.live.conf 的基础上关掉合并读写。
# 用法：SRS_CONF=$PWD/tools/latency/srs-low-latency.conf tools/ws-flv-live.sh start --sei ...
# 参考：https://ossrs.io/lts/zh-cn/docs/v7/doc/low-latency

max_connections     1000;
daemon              off;
srs_log_tank        console;
rtmp {
    listen              1935;
}
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}
vhost __defaultVhost__ {
    # min_latency 打开后 SRS 不再攒包合并发送（mw_latency 默认 350ms，是锯齿延迟的来源）
    min_latency     on;
    tcp_nodelay     on;
    play {
        # GOP 缓存保留：关掉后新连接要等下一个关键帧才出画面；
        # 打开时新连接会先收到一整个 GOP 的积压，交给播放端追帧处理
        gop_cache       on;
        mw_latency      0;
        mw_msgs         0;
    }
    publish {
        mr              off;
    }
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
}
