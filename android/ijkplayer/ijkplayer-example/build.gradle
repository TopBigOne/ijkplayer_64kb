apply plugin: 'com.android.application'

android {
    compileSdk 35

    // http://tools.android.com/tech-docs/new-build-system/tips
    //noinspection GroovyAssignabilityCheck
    //noinspection GroovyAssignabilityCheck

    defaultConfig {
        applicationId "tv.danmaku.ijk.media.example"
        minSdkVersion 21
        targetSdk 35
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        ndk {
            abiFilters "arm64-v8a","armeabi-v7a"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'tv.danmaku.ijk.media.example'
    lint {
        abortOnError false
    }
}

dependencies {
//    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.annotation:annotation:1.8.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.1.1'
    implementation 'androidx.preference:preference:1.1.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'com.squareup:otto:1.3.8'
    implementation project(':ijkplayer-cmake')

    // 字节 CodeLocator（配合 Android Studio 插件抓取界面/定位代码），仅 debug 包引入
    debugImplementation "com.bytedance.tools.codelocator:codelocator-core:2.0.4"
    // 注意：lancet 模块需配合 Lancet 编译插件才会织入代码；未接插件时只是引入类，不生效
    debugImplementation "com.bytedance.tools.codelocator:codelocator-lancet-all:2.0.4"
}
